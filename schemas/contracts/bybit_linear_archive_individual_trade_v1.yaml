contract_id: bybit.linear.archive.individual-trade.v1
source_dataset_id: bybit.linear.individual_trade.archive
exchange: bybit
market_type: perpetual
contract_type: linear_perpetual
source_kind: daily_archive
official_documentation_url: https://www.bybit.com/en/derivative-activity/history-data
verified_at: "2026-08-10T00:00:00Z"
schema_version: 1.0.0
request_rules:
  uri_template: "https://public.bybit.com/trading/{symbol}/{symbol}{YYYY-MM-DD}.csv.gz"
  checksum_sidecar: null
  timestamp_unit_policy: "epoch float seconds (sub-millisecond microsecond precision) in observed Bybit Linear trade archive CSV objects"
  exact_header: [timestamp, symbol, side, size, price, tickDirection, trdMatchID, grossValue, homeNotional, foreignNotional, RPI]
fields:
  - {source_field: timestamp, semantic_meaning: trade execution timestamp, source_unit: float_epoch_s, nullable: false, canonical_field: event_time, transformation: float_s_to_utc, normalized_unit: UTC}
  - {source_field: symbol, semantic_meaning: native symbol name, source_unit: string, nullable: false, canonical_field: native_symbol, transformation: string_preserving, normalized_unit: symbol}
  - {source_field: side, semantic_meaning: trade aggressor/taker side, source_unit: string, nullable: false, canonical_field: taker_side, transformation: "Buy->BUY; Sell->SELL; case-insensitive fixture-gated", normalized_unit: side}
  - {source_field: size, semantic_meaning: executed base-asset quantity, source_unit: base_asset, nullable: false, canonical_field: quantity, transformation: string_to_decimal, normalized_unit: base_asset}
  - {source_field: price, semantic_meaning: execution price, source_unit: quote_per_base, nullable: false, canonical_field: price, transformation: string_to_decimal, normalized_unit: quote_per_base}
  - {source_field: trdMatchID, semantic_meaning: exchange individual trade execution identifier (UUID), source_unit: identifier, nullable: false, canonical_field: native_trade_id, transformation: string_preserving, normalized_unit: identifier}
  - {source_field: RPI, semantic_meaning: retail price improvement flag, source_unit: string, nullable: true, canonical_field: is_rpi_trade, transformation: "1->true; 0->false", normalized_unit: boolean}
absent_fields:
  - {canonical_field: is_buyer_maker, value: null, reason: "Bybit provides direct taker side (Buy/Sell) instead of is_buyer_maker boolean"}
