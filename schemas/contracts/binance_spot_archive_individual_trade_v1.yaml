contract_id: binance.spot.archive.individual-trade.v1
source_dataset_id: binance.spot.individual_trade.archive
exchange: binance
market_type: spot
source_kind: daily_archive
official_documentation_url: https://github.com/binance/binance-public-data/blob/master/README.md
verified_at: "2026-08-10T00:00:00Z"
schema_version: 1.0.0
request_rules:
  uri_template: "https://data.binance.vision/data/spot/daily/trades/{symbol}/{symbol}-trades-{YYYY-MM-DD}.zip"
  checksum_sidecar: ".CHECKSUM"
  timestamp_unit_policy: "us from 2025-01-01 for Spot archive objects"
fields:
  - {source_field: "[0]", semantic_meaning: exchange individual trade identifier, source_unit: identifier, nullable: false, canonical_field: native_trade_id, transformation: string_preserving, normalized_unit: identifier}
  - {source_field: "[1]", semantic_meaning: execution price, source_unit: quote_per_base, nullable: false, canonical_field: price, transformation: string_to_decimal, normalized_unit: USDT_per_BTC}
  - {source_field: "[2]", semantic_meaning: executed base quantity, source_unit: BTC, nullable: false, canonical_field: quantity, transformation: string_to_decimal, normalized_unit: BTC}
  - {source_field: "[3]", semantic_meaning: executed quote quantity, source_unit: USDT, nullable: false, canonical_field: quote_quantity, transformation: string_to_decimal, normalized_unit: USDT}
  - {source_field: "[4]", semantic_meaning: trade execution timestamp, source_unit: epoch_us, nullable: false, canonical_field: event_time, transformation: explicit_us_to_utc, normalized_unit: UTC}
  - {source_field: "[5]", semantic_meaning: whether buyer supplied resting liquidity, source_unit: boolean, nullable: false, canonical_field: taker_side, transformation: "true->SELL; false->BUY; fixture-gated", normalized_unit: side}
  - {source_field: "[6]", semantic_meaning: exchange best-match flag, source_unit: boolean, nullable: false, canonical_field: is_best_match, transformation: boolean_preserving, normalized_unit: boolean}
