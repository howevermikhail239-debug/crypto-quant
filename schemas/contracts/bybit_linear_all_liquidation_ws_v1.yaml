contract_id: bybit.linear.ws.all-liquidation.v1
source_dataset_id: bybit.linear.liquidations.ws
exchange: bybit
market_type: perpetual
contract_type: linear_perpetual
source_kind: websocket
official_documentation_url: https://bybit-exchange.github.io/docs/v5/websocket/public/all-liquidation
verified_at: "2026-08-11T08:26:10Z"
schema_version: 1.0.0

stream_rules:
  endpoint: wss://stream.bybit.com/v5/public/linear
  topic: allLiquidation.{symbol}
  # Bybit claims ALL liquidations are pushed via this stream (replaces deprecated throttled topic).
  # Delivery is batched: pushed every 500ms when liquidations occur, NOT a continuous unthrottled feed.
  source_claimed_completeness: ALL_LIQUIDATIONS
  delivery_semantics: BATCHED_500MS_PUSH
  # local_capture_completeness: depends on connection uptime and gap recovery
  message_type: snapshot
  # NOTE: "snapshot" is the message batch label (metadata tag), NOT a stateful snapshot.
  # Each message appends events; it does NOT replace previously accumulated history.

native_event_id: NONE
# Bybit allLiquidation stream provides NO native per-event ID or sequence number.
# Dedup guarantee boundary:
#   exact-wire replay dedup: GUARANTEED (message_id = SHA-256 of raw envelope; dedup_fingerprint = per-event hash)
#   cross-envelope economic-event dedup: NOT GUARANTEED
#   Rationale: same economic liquidation event delivered in different WS envelope produces different message_id.
#   Project policy: preserve uncertain events rather than risk dropping distinct events.

fields:
  - source_field: topic
    semantic_meaning: subscription_topic
    source_unit: string
    nullable: false
    canonical_field: routing
    transformation: exact_match
    normalized_unit: symbol

  - source_field: type
    semantic_meaning: websocket_message_batch_label
    source_unit: string
    nullable: false
    canonical_field: message_type
    transformation: preserve
    normalized_unit: string
    known_limitations:
      - "'snapshot' is the batch envelope label; does NOT mean state-replaceable snapshot. Messages append, not replace."

  - source_field: ts
    semantic_meaning: system_generation_timestamp_ms
    # Bybit system timestamp when the message was pushed (server-side clock)
    source_unit: epoch_ms
    nullable: false
    canonical_field: exchange_timestamp
    transformation: epoch_ms_to_utc
    normalized_unit: UTC

  - source_field: "data[].T"
    # VERIFIED: official Bybit docs label = "updated time" (milliseconds)
    # NOT "trade timestamp", NOT "execution timestamp", NOT "fill timestamp"
    # This is the liquidation event updated timestamp as recorded by Bybit.
    semantic_meaning: liquidation_event_updated_timestamp_ms
    source_unit: epoch_ms
    timestamp_meaning: event_updated_time
    nullable: false
    canonical_field: event_time
    transformation: epoch_ms_to_utc
    normalized_unit: UTC
    evidence: VERIFIED (bybit-exchange.github.io/docs/v5/websocket/public/all-liquidation)

  - source_field: "data[].s"
    semantic_meaning: symbol_name
    source_unit: string
    nullable: false
    canonical_field: symbol
    transformation: exact_match
    normalized_unit: symbol

  - source_field: "data[].S"
    # VERIFIED: official docs — "Buy" = long position liquidated; "Sell" = short position liquidated
    semantic_meaning: liquidated_position_side_buy_long_sell_short
    source_unit: string
    nullable: false
    canonical_field: position_side_liquidated
    transformation: map_bybit_position_side
    normalized_unit: enum_LONG_SHORT
    mapping:
      Buy: LONG   # Long position was liquidated (forced buy order issued to close short position)
      Sell: SHORT  # Short position was liquidated (forced sell order issued to close long position)
    evidence: VERIFIED

  - source_field: "data[].v"
    # VERIFIED: official docs label = "Executed size" (string).
    # Economic unit for BTCUSDT Linear: base coin (BTC). Bybit V5 linear perpetual contract size = 1 BTC.
    # qty denominated in base coin. Source: bybit-exchange.github.io V5 trade/order parameters.
    semantic_meaning: executed_liquidation_size_in_base_coin
    source_unit: base_coin
    nullable: false
    canonical_field: source_quantity
    transformation: string_to_decimal_raw
    normalized_unit: base_coin
    evidence: VERIFIED (executed_size_label=VERIFIED; unit_base_coin_BTCUSDT=VERIFIED)

  - source_field: "data[].p"
    # VERIFIED: official docs label = "Bankruptcy price" (string).
    # This is the price at which the position's margin is exhausted (0% margin level).
    # NOT the actual fill/execution price of the liquidation order.
    semantic_meaning: bankruptcy_price
    source_unit: quote_asset
    nullable: false
    canonical_field: source_price
    transformation: string_to_decimal_raw
    normalized_unit: quote_asset
    evidence: VERIFIED

known_limitations:
  - "Bybit price p represents the bankruptcy price of the liquidated position, not the execution fill price."
  - "Historical bulk liquidation archive is unavailable from venue; local history starts from first captured realtime event."
  - "Legacy WebSocket topic liquidation.{symbol} is deprecated; it returned handler-not-found and was throttled (1 msg/s/contract)."
  - "Message label 'snapshot' is a batch envelope metadata tag and does NOT imply state replacement; messages accumulate."
  - "No native per-event ID: cross-envelope economic-event dedup is NOT GUARANTEED. Exact-wire replay dedup only."
  - "Delivery is batched at 500ms intervals, not a true unthrottled stream; local capture completeness depends on uptime."
